name: Build macOS DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      # actions/checkout traverses orphaned gitlinks under .repos during credential cleanup.
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --frozen-lockfile --filter=@t3tools/desktop... --filter=@t3tools/web... --filter=t3... --filter=@t3tools/scripts...

      - name: Set up Rust
        run: rustup default stable

      - name: Build and verify Apple Silicon installer
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./apps/desktop/package.json").version')
          version="${version%%-*}-preview.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          out="$RUNNER_TEMP/t3-macos"
          vp run dist:desktop:dmg:arm64 --build-version "$version" --output-dir "$out"
          dmg="$out/T3-Code-$version-arm64.dmg"
          hdiutil verify "$dmg"
          mount=$(mktemp -d "$RUNNER_TEMP/t3-mount.XXXXXX")
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount"' EXIT
          apps=("$mount"/*.app)
          codesign --verify --deep --strict "${apps[0]}"
          frpc="${apps[0]}/Contents/Resources/frp/frpc"
          lipo -verify_arch arm64 "$frpc"
          "$frpc" --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t3code-macos-arm64
          path: ${{ runner.temp }}/t3-macos/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
