name: 构建 iOS 安装包

on:
  workflow_dispatch:
    inputs:
      package:
        description: iPhone IPA or Apple Silicon Simulator app
        type: choice
        default: iphone-unsigned
        options:
          - iphone-unsigned
          - iphone-signed
          - simulator
      bundle_identifier:
        description: Bundle identifier matching your profile for signed IPA builds
        type: string
        default: com.icbai.t3code.preview

permissions:
  contents: read

jobs:
  package:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      APP_VARIANT: preview
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      T3CODE_IOS_PERSONAL_TEAM: "1"
      T3CODE_IOS_PERSONAL_TEAM_BUNDLE_ID: ${{ inputs.bundle_identifier }}
      EXPO_NO_GIT_STATUS: "1"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --frozen-lockfile --filter=@t3tools/mobile...

      - name: Generate Xcode workspace
        working-directory: apps/mobile
        run: |
          xcodebuild -version
          vp exec expo prebuild --clean --platform ios --no-install
          cd ios
          pod install

      - name: Build unsigned IPA or Simulator app
        if: inputs.package != 'iphone-signed'
        working-directory: apps/mobile
        env:
          IOS_PACKAGE: ${{ inputs.package }}
        run: |
          if [[ "$IOS_PACKAGE" == simulator ]]; then
            destination='generic/platform=iOS Simulator'
            sdk=iphonesimulator
          else
            destination='generic/platform=iOS'
            sdk=iphoneos
          fi

          xcodebuild -workspace ios/T3Code.xcworkspace -scheme T3Code \
            -configuration Release -destination "$destination" \
            -derivedDataPath "$RUNNER_TEMP/ios-build" -jobs 2 \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build

          app="$RUNNER_TEMP/ios-build/Build/Products/Release-$sdk/T3Code.app"
          test -f "$app/main.jsbundle"
          mkdir -p "$RUNNER_TEMP/ios-artifacts"
          if [[ "$IOS_PACKAGE" == simulator ]]; then
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/ios-artifacts/T3Code-ios-simulator-arm64.zip"
          else
            mkdir -p "$RUNNER_TEMP/Payload"
            ditto "$app" "$RUNNER_TEMP/Payload/T3Code.app"
            ditto -c -k --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/ios-artifacts/T3Code-ios-unsigned.ipa"
          fi

      - name: Build and export signed iPhone IPA
        if: inputs.package == 'iphone-signed'
        working-directory: apps/mobile
        env:
          IOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.IOS_SIGNING_CERTIFICATE_BASE64 }}
          IOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [[ -z "$IOS_SIGNING_CERTIFICATE_BASE64" || -z "$IOS_PROVISIONING_PROFILE_BASE64" ]]; then
            echo '::error::Set IOS_SIGNING_CERTIFICATE_BASE64 and IOS_PROVISIONING_PROFILE_BASE64. Also set IOS_SIGNING_CERTIFICATE_PASSWORD if your Apple Distribution .p12 has a password.'
            exit 1
          fi

          signing_dir="$(mktemp -d "$RUNNER_TEMP/t3-ios-signing.XXXXXX")"
          keychain="$signing_dir/signing.keychain-db"
          trap 'security delete-keychain "$keychain" 2>/dev/null || true; rm -rf "$signing_dir"' EXIT
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$IOS_SIGNING_CERTIFICATE_BASE64" | base64 --decode > "$signing_dir/distribution.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$signing_dir/adhoc.mobileprovision"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/distribution.p12" -k "$keychain" \
            -P "$IOS_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          rm "$signing_dir/distribution.p12"
          unset IOS_SIGNING_CERTIFICATE_BASE64 IOS_SIGNING_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64

          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Apple Distribution:/ { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo '::error::The .p12 must contain an Apple Distribution certificate and its private key.'
            exit 1
          fi
          security cms -D -i "$signing_dir/adhoc.mobileprovision" -o "$signing_dir/profile.plist"
          export IOS_SIGNING_DIR="$signing_dir" IOS_SIGNING_IDENTITY="$identity"
          python3 - <<'PY'
          import hashlib
          import os
          import plistlib
          from pathlib import Path

          directory = Path(os.environ["IOS_SIGNING_DIR"])
          bundle = os.environ["T3CODE_IOS_PERSONAL_TEAM_BUNDLE_ID"]
          identity = os.environ["IOS_SIGNING_IDENTITY"]
          profile = plistlib.loads((directory / "profile.plist").read_bytes())
          entitlements = profile["Entitlements"]
          app_id = f"{profile['ApplicationIdentifierPrefix'][0]}.{bundle}"
          certificates = {hashlib.sha1(cert).hexdigest().upper() for cert in profile["DeveloperCertificates"]}
          if (
              entitlements["application-identifier"] != app_id
              or entitlements.get("get-task-allow", False)
              or not profile.get("ProvisionedDevices")
              or identity not in certificates
          ):
              raise SystemExit("Use an Ad Hoc profile matching the bundle ID, the certificate, and the registered devices.")

          team = profile["TeamIdentifier"][0]
          uuid = profile["UUID"]
          profile_path = Path.home() / "Library/Developer/Xcode/UserData/Provisioning Profiles"
          profile_path.mkdir(parents=True, exist_ok=True)
          (profile_path / f"{uuid}.mobileprovision").write_bytes((directory / "adhoc.mobileprovision").read_bytes())
          (directory / "signing.plist").write_bytes(plistlib.dumps({
              "method": "release-testing",
              "signingStyle": "manual",
              "signingCertificate": identity,
              "teamID": team,
              "provisioningProfiles": {bundle: uuid},
          }))

          entitlement_path = Path("ios/T3Code/T3Code.entitlements")
          app_entitlements = plistlib.loads(entitlement_path.read_bytes())
          for key in ("aps-environment", "com.apple.developer.associated-domains", "keychain-access-groups"):
              app_entitlements.pop(key, None)
          entitlement_path.write_bytes(plistlib.dumps(app_entitlements))
          PY

          node <<'JS'
          const path = require("node:path");
          const fs = require("node:fs");
          const { IOSConfig } = require("expo/config-plugins");
          const { default: plist } = require(require.resolve("@expo/plist", { paths: [require.resolve("expo/config-plugins")] }));
          const options = plist.parse(fs.readFileSync(path.join(process.env.IOS_SIGNING_DIR, "signing.plist"), "utf8"));
          const project = IOSConfig.XcodeUtils.getPbxproj(process.cwd());
          const { target } = IOSConfig.XcodeUtils.getApplicationNativeTarget({ project, projectName: "T3Code" });
          const [, configuration] = IOSConfig.XcodeUtils.getBuildConfigurationForListIdAndName(project, {
            configurationListId: target.buildConfigurationList,
            buildConfiguration: "Release",
          });
          Object.assign(configuration.buildSettings, {
            CODE_SIGN_STYLE: "Manual",
            '"CODE_SIGN_IDENTITY[sdk=iphoneos*]"': '"Apple Distribution"',
            DEVELOPMENT_TEAM: options.teamID,
            PROVISIONING_PROFILE_SPECIFIER: options.provisioningProfiles[process.env.T3CODE_IOS_PERSONAL_TEAM_BUNDLE_ID],
          });
          fs.writeFileSync("ios/T3Code.xcodeproj/project.pbxproj", project.writeSync());
          JS

          xcodebuild -workspace ios/T3Code.xcworkspace -scheme T3Code \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/T3Code.xcarchive" -jobs 2 COMPILER_INDEX_STORE_ENABLE=NO archive
          test -f "$RUNNER_TEMP/T3Code.xcarchive/Products/Applications/T3Code.app/main.jsbundle"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/T3Code.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" -exportOptionsPlist "$signing_dir/signing.plist"
          mkdir -p "$RUNNER_TEMP/ios-artifacts"
          cp "$RUNNER_TEMP"/ios-export/*.ipa "$RUNNER_TEMP/ios-artifacts/T3Code-ios-signed.ipa"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: t3code-ios-${{ inputs.package }}
          path: ${{ runner.temp }}/ios-artifacts/
          if-no-files-found: error
          retention-days: 14
